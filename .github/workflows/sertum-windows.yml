# Kompilacja klienta "Sertum Pomoc Zdalna" (Windows x64, wersja przenośna).
#
# Plik umieść w forku RustDesk jako .github/workflows/sertum-windows.yml,
# a katalog sertum/ (skrypty + branding) w katalogu głównym forka.
#
# Ustawienia repozytorium (Settings → Secrets and variables → Actions):
#   Variables:  SERTUM_HOST   np. pomoc.sertum.pl
#               SERTUM_KEY    zawartość data/id_ed25519.pub z serwera
#               SIGN_METHOD   digicert | none   (none = kompilacja testowa bez podpisu)
#               SM_HOST       adres środowiska DigiCert ONE (np. https://clientauth.one.digicert.com)
#               SM_KEYPAIR_ALIAS  alias pary kluczy w DigiCert KeyLocker
#   Secrets:    SM_API_KEY               klucz API z DigiCert ONE
#               SM_CLIENT_CERT_FILE_B64  certyfikat uwierzytelniający .p12 zakodowany base64
#               SM_CLIENT_CERT_PASSWORD  hasło do pliku .p12
#
# Podpisywane są tylko 3 pliki na kompilację (rustdesk.exe, librustdesk.dll
# i gotowy SertumPomoc.exe), żeby oszczędzać pulę podpisów w KeyLocker.
#
# Wariant (parametr przy uruchomieniu):
#   pomoc   – SertumPomoc.exe dla klientów (tylko połączenia przychodzące); podpis wg SIGN_METHOD
#             (3 podpisy: rustdesk.exe, librustdesk.dll, SertumPomoc.exe)
#   pomoc32 – SertumPomoc32.exe, to samo dla 32-bitowego Windows (interfejs Sciter);
#             podpis wg SIGN_METHOD (2 podpisy: rustdesk.exe, SertumPomoc32.exe)
#   technik – SertumTechnik.exe dla techników (pełny); NIGDY nie jest podpisywany
#
# Kroki budowania są przeniesione 1:1 z upstream (flutter-build.yml, RustDesk 1.5.0):
# build-windows = job build-for-windows-flutter (x86_64),
# build-windows-x86 = job build-for-windows-sciter (i686).
# Przy aktualizacji RustDesk porównaj je z nową wersją upstream.

name: Sertum Pomoc – Windows

run-name: Sertum – ${{ inputs.variant }}

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Wariant: pomoc (klienci, 64-bit), pomoc32 (klienci, 32-bit) lub technik (wewnętrzny, bez podpisu)"
        type: choice
        options: [pomoc, pomoc32, technik]
        default: pomoc

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  OUTPUT_NAME: ${{ inputs.variant == 'technik' && 'SertumTechnik' || inputs.variant == 'pomoc32' && 'SertumPomoc32' || 'SertumPomoc' }}

jobs:
  generate-bridge:
    if: inputs.variant != 'pomoc32'
    uses: ./.github/workflows/bridge.yml

  build-windows:
    if: inputs.variant != 'pomoc32'
    needs: [generate-bridge]
    runs-on: windows-2022
    env:
      # Wariant technik nigdy nie zużywa puli podpisów.
      SIGN_METHOD: ${{ inputs.variant == 'pomoc' && (vars.SIGN_METHOD || 'none') || 'none' }}
      SM_HOST: ${{ vars.SM_HOST }}
      SM_API_KEY: ${{ secrets.SM_API_KEY }}
      SM_CLIENT_CERT_FILE: D:\sm_client_auth.p12
      SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Apply Sertum configuration
        shell: bash
        env:
          SERTUM_HOST: ${{ vars.SERTUM_HOST }}
          SERTUM_KEY: ${{ vars.SERTUM_KEY }}
          SERTUM_VARIANT: ${{ inputs.variant }}
        run: |
          if [ -z "$SERTUM_HOST" ] || [ -z "$SERTUM_KEY" ]; then
            echo "::error::Ustaw zmienne repozytorium SERTUM_HOST i SERTUM_KEY"; exit 1
          fi
          args=(--host "$SERTUM_HOST" --key "$SERTUM_KEY" --variant "${SERTUM_VARIANT:-pomoc}")
          [ -d sertum/branding ] && args+=(--branding sertum/branding)
          python3 sertum/sertum_configure.py "${args[@]}"

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Sterownik wirtualnego monitora (używany przy pracy bez fizycznego ekranu)
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: Copy Runner.res for the portable packer
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res" | head -1)
          if [ -n "$runner_res" ]; then cp "$runner_res" ./libs/portable/Runner.res; fi

      - name: Prepare DigiCert client certificate
        if: env.SIGN_METHOD == 'digicert'
        shell: bash
        run: echo "${{ secrets.SM_CLIENT_CERT_FILE_B64 }}" | base64 --decode > /d/sm_client_auth.p12

      - name: Sign rustdesk.exe (DigiCert KeyLocker)
        if: env.SIGN_METHOD == 'digicert'
        uses: digicert/code-signing-software-trust-action@v1
        with:
          simple-signing-mode: true
          keypair-alias: ${{ vars.SM_KEYPAIR_ALIAS }}
          input: ./rustdesk/rustdesk.exe

      - name: Sign librustdesk.dll (DigiCert KeyLocker)
        if: env.SIGN_METHOD == 'digicert'
        uses: digicert/code-signing-software-trust-action@v1
        with:
          simple-signing-mode: true
          keypair-alias: ${{ vars.SM_KEYPAIR_ALIAS }}
          input: ./rustdesk/librustdesk.dll

      - name: Build self-extracting executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/${OUTPUT_NAME}.exe"

      - name: Sign SertumPomoc.exe (DigiCert KeyLocker)
        if: env.SIGN_METHOD == 'digicert'
        uses: digicert/code-signing-software-trust-action@v1
        with:
          simple-signing-mode: true
          keypair-alias: ${{ vars.SM_KEYPAIR_ALIAS }}
          input: ./SignOutput/${{ env.OUTPUT_NAME }}.exe

      - name: Verify signatures
        shell: pwsh
        run: |
          $files = @('./rustdesk/rustdesk.exe', './rustdesk/librustdesk.dll', "./SignOutput/$env:OUTPUT_NAME.exe")
          $bad = 0
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f
            Write-Host ("{0,-40} {1,-10} {2}" -f (Split-Path $f -Leaf), $s.Status, $s.SignerCertificate.Subject)
            if ($s.Status -ne 'Valid') { $bad++ }
          }
          if ($bad -gt 0) {
            if ($env:SIGN_METHOD -eq 'digicert') { throw "Niepoprawny podpis w $bad plik(ach)" }
            Write-Warning "SIGN_METHOD=$env:SIGN_METHOD – pliki NIE są podpisane (kompilacja testowa)."
          }

      - name: Remove client certificate
        if: always() && env.SIGN_METHOD == 'digicert'
        shell: bash
        run: rm -f /d/sm_client_auth.p12

      - name: Checksum
        shell: bash
        run: sha256sum ./SignOutput/*.exe | tee ./SignOutput/SHA256SUMS.txt

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sertum-${{ inputs.variant }}-windows-x64
          path: ./SignOutput/

  # 32-bit Windows: Flutter nie obsługuje x86, więc – jak upstream – interfejs Sciter.
  build-windows-x86:
    if: inputs.variant == 'pomoc32'
    runs-on: windows-2022
    env:
      SIGN_METHOD: ${{ vars.SIGN_METHOD || 'none' }}
      SM_HOST: ${{ vars.SM_HOST }}
      SM_API_KEY: ${{ secrets.SM_API_KEY }}
      SM_CLIENT_CERT_FILE: D:\sm_client_auth.p12
      SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Apply Sertum configuration
        shell: bash
        env:
          SERTUM_HOST: ${{ vars.SERTUM_HOST }}
          SERTUM_KEY: ${{ vars.SERTUM_KEY }}
        run: |
          if [ -z "$SERTUM_HOST" ] || [ -z "$SERTUM_KEY" ]; then
            echo "::error::Ustaw zmienne repozytorium SERTUM_HOST i SERTUM_KEY"; exit 1
          fi
          args=(--host "$SERTUM_HOST" --key "$SERTUM_KEY" --variant pomoc32)
          [ -d sertum/branding ] && args+=(--branding sertum/branding)
          python3 sertum/sertum_configure.py "${args[@]}"

      - name: Install LLVM and Clang
        uses: rustdesk-org/install-llvm-action-32bit@6aa7d9ad3df84dff01cd4596dd0fc880a7f47fce # no release tag; commit 2026-05-26
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust toolchain
        shell: bash
        run: |
          # Sciter (abi_thiscall) wymaga nightly; toolchain i686, żeby build scripts
          # mogły załadować 32-bitowe LLVM (jak upstream).
          rustup toolchain install nightly-2023-10-13-i686-pc-windows-msvc \
            --target i686-pc-windows-msvc --component rustfmt \
            --profile minimal --no-self-update --force-non-host
          rustup default nightly-2023-10-13-i686-pc-windows-msvc --force-non-host

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022-sciter

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x86-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x86-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Build rustdesk
        shell: bash
        run: |
          python3 res/inline-sciter.py
          # Patch sciter x86
          sed -i 's/branch = "dyn"/branch = "dyn_x86"/g' ./Cargo.toml
          cargo update -p sciter-rs --precise 674e07d3066ca9a92ced3816203ab6b652629d1e
          cargo build --locked --features inline,vram,hwcodec --release --bins
          mkdir -p ./Release
          mv ./target/release/rustdesk.exe ./Release/rustdesk.exe
          curl -LJ -o ./Release/sciter.dll https://github.com/c-smile/sciter-sdk/raw/master/bin.win/x32/sciter.dll
          curl -LJ -o ./usbmmidd_v2.zip https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
          unzip usbmmidd_v2.zip
          # Jak upstream: zostawiamy pliki x64 (32-bit może działać na 64-bit Windows).
          rm -rf ./usbmmidd_v2/deviceinstaller.exe ./usbmmidd_v2/usbmmidd.bat
          mv ./usbmmidd_v2 ./Release || true

      - name: Prepare DigiCert client certificate
        if: env.SIGN_METHOD == 'digicert'
        shell: bash
        run: echo "${{ secrets.SM_CLIENT_CERT_FILE_B64 }}" | base64 --decode > /d/sm_client_auth.p12

      - name: Sign rustdesk.exe (DigiCert KeyLocker)
        if: env.SIGN_METHOD == 'digicert'
        uses: digicert/code-signing-software-trust-action@v1
        with:
          simple-signing-mode: true
          keypair-alias: ${{ vars.SM_KEYPAIR_ALIAS }}
          input: ./Release/rustdesk.exe

      - name: Build self-extracting executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../Release/ -o . -e ../../Release/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/${OUTPUT_NAME}.exe"

      - name: Sign SertumPomoc32.exe (DigiCert KeyLocker)
        if: env.SIGN_METHOD == 'digicert'
        uses: digicert/code-signing-software-trust-action@v1
        with:
          simple-signing-mode: true
          keypair-alias: ${{ vars.SM_KEYPAIR_ALIAS }}
          input: ./SignOutput/${{ env.OUTPUT_NAME }}.exe

      - name: Verify signatures and architecture
        shell: pwsh
        run: |
          $files = @('./Release/rustdesk.exe', "./SignOutput/$env:OUTPUT_NAME.exe")
          $bad = 0
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f
            $b = [IO.File]::ReadAllBytes((Resolve-Path $f))
            $pe = [BitConverter]::ToInt32($b, 0x3c)
            $machine = '{0:X4}' -f [BitConverter]::ToUInt16($b, $pe + 4)
            Write-Host ("{0,-40} {1,-10} machine=0x{2} {3}" -f (Split-Path $f -Leaf), $s.Status, $machine, $s.SignerCertificate.Subject)
            if ($machine -ne '014C') { throw "$f nie jest 32-bitowy (machine=0x$machine)" }
            if ($s.Status -ne 'Valid') { $bad++ }
          }
          if ($bad -gt 0) {
            if ($env:SIGN_METHOD -eq 'digicert') { throw "Niepoprawny podpis w $bad plik(ach)" }
            Write-Warning "SIGN_METHOD=$env:SIGN_METHOD – pliki NIE są podpisane (kompilacja testowa)."
          }

      - name: Remove client certificate
        if: always() && env.SIGN_METHOD == 'digicert'
        shell: bash
        run: rm -f /d/sm_client_auth.p12

      - name: Checksum
        shell: bash
        run: sha256sum ./SignOutput/*.exe | tee ./SignOutput/SHA256SUMS.txt

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sertum-pomoc32-windows-x86
          path: ./SignOutput/
